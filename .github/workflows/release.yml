name: Release

on:
  push:
    branches: [main]
  # Rebuilds the .dmg of an existing release, e.g. after a failed upload.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      # The package lives in src-tauri/, so the outputs are prefixed with its path.
      created: ${{ steps.release.outputs['src-tauri--release_created'] }}
      tag: ${{ steps.release.outputs['src-tauri--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Not GITHUB_TOKEN: pull requests it opens don't trigger CI, so the
          # release PR could never pass the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  bundle:
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.created == 'true'
      || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - id: release
        run: echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          # Only attaches the .dmg: the release and its notes come from release-please.
          releaseId: ${{ steps.release.outputs.id }}
          # Apple Silicon only: no Intel build.
          args: --target aarch64-apple-darwin
