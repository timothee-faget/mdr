<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    mdr's app icon, on the macOS grid: an 824 px rounded square in a 1024 px
    canvas. The text uses New York (ui-serif), the macOS system serif, so
    render it on a Mac: `just icon` regenerates assets/icon.png and the app
    icons in src-tauri/icons.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efdc"/><stop offset="1" stop-color="#e9dcbd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <text x="512" y="610" text-anchor="middle" font-family="ui-serif, New York, Georgia, serif" font-style="italic" font-weight="600" font-size="400" fill="#3b2f1e">md</text>
  <rect x="332" y="680" width="360" height="26" rx="13" fill="#9c4a1a"/>
</svg>
