[package]
name = "mdr"
version = "0.1.0"
description = "A minimal, read-only Markdown viewer for macOS"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "mdr_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4.2.4"
comrak = { version = "0.56.0", default-features = false }
notify-debouncer-full = "0.7.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["html", "regex-onig"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
toml = "1.1.8"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
insta = { version = "1.49.0", features = ["glob"] }

[lints]
workspace = true
