<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css" />
    <script type="module" src="settings.js"></script>
  </head>
  <body>
    <form>
      <section class="group">
        <div class="row">
          <span>Appearance</span>
          <div class="segmented" role="radiogroup" aria-label="Appearance">
            <label><input type="radio" name="appearance" value="auto" />Auto</label>
            <label><input type="radio" name="appearance" value="light" />Light</label>
            <label><input type="radio" name="appearance" value="dark" />Dark</label>
          </div>
        </div>
      </section>

      <h2>Light theme</h2>
      <section class="group theme" data-side="light"></section>

      <h2>Dark theme</h2>
      <section class="group theme" data-side="dark"></section>

      <h2>Text</h2>
      <section class="group">
        <div class="row">
          <label for="font">Font</label>
          <select id="font"></select>
        </div>
        <div class="row" id="font-other-row" hidden>
          <label for="font-other">Font list</label>
          <input id="font-other" spellcheck="false" placeholder="Charter, Georgia, serif" />
        </div>
        <p id="sample">The quick brown fox jumps over the lazy dog.</p>
        <div class="row">
          <label for="size">Text size</label>
          <span><input id="size" type="number" min="8" max="48" step="1" /> px</span>
        </div>
        <div class="row">
          <label for="width">Column width</label>
          <span class="width"><input id="width" type="range" min="40" max="120" step="5" /> <output id="width-value"></output></span>
        </div>
      </section>

      <footer>
        <p id="error" role="alert"></p>
        <button type="button" id="show-config">Show Config File</button>
      </footer>
    </form>

    <!-- Filled in for each side, light and dark. -->
    <template id="theme">
      <div class="cards" role="radiogroup"></div>
      <details>
        <summary>Customize <span class="theme-name"></span></summary>
        <div class="row"><label>Background</label><input type="color" data-key="background" /></div>
        <div class="row"><label>Text</label><input type="color" data-key="text" /></div>
        <div class="row"><label>Secondary text</label><input type="color" data-key="muted" /></div>
        <div class="row"><label>Links and accents</label><input type="color" data-key="accent" /></div>
        <div class="row"><label>Code background</label><input type="color" data-key="code_background" /></div>
        <div class="row"><label>Borders</label><input type="color" data-key="border" /></div>
        <div class="row"><label>Code colors</label><select data-key="code_theme"></select></div>
        <div class="row"><span></span><button type="button" class="reset">Reset to Defaults</button></div>
      </details>
    </template>
  </body>
</html>
